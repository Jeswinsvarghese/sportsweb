<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cricket Hub | Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
</head>
<body>
    <div class="admin-layout">
        <aside class="admin-sidebar">
            <div class="sidebar-header">
                <img src="{{ url_for('static', filename='img/logo.jpg') }}" alt="Logo" class="sidebar-logo">
                <h2>Sports Central</h2>
            </div>
            <nav class="sidebar-nav">
                <ul>
                    <li id="nav-feedback">
                        <a href="{{ url_for('admin_dashboard') }}"><i class="fas fa-comments"></i><span>Feedback Management</span></a>
                    </li>
                    <li id="nav-api-management">
                        <a href="{{ url_for('api_management') }}"><i class="fas fa-key"></i><span>API Management</span></a>
                    </li>
                    <li id="nav-api-usage">
                        <a href="{{ url_for('api_usage') }}"><i class="fas fa-chart-line"></i><span>API Usage</span></a>
                    </li>
                </ul>
            </nav>
            <div class="sidebar-footer">
                <p>&copy; 2025 All rights reserved.</p>
            </div>
        </aside>

        <main class="admin-main-content">
            <header class="admin-content-header">
                <h1>{% block page_title %}{% endblock %}</h1>
                <div class="controls">
                    <a href="{{ url_for('admin_logout') }}" class="logout-btn">Logout</a>
                    <button id="theme-toggle-button" title="Toggle Theme"></button>
                </div>
            </header>
            <div class="admin-content-area">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>

    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
    <script src="{{ url_for('static', filename='js/admin_nav.js') }}"></script>
</body>
</html>
